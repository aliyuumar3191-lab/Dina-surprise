<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>A little surprise 💕</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#070016;
  color:white;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  display:flex;align-items:center;justify-content:center;
}
.bg{position:fixed;inset:-20%;filter:blur(45px);opacity:.75}
.orb{position:absolute;width:45vw;height:45vw;border-radius:50%;
  background:radial-gradient(circle,#ff36c8 0%,transparent 68%);
  animation:float 7s ease-in-out infinite alternate}
.o1{left:0;top:5%}.o2{right:0;bottom:0;background:radial-gradient(circle,#6c4cff 0%,transparent 68%);animation-delay:-3s}
.o3{left:30%;top:35%;background:radial-gradient(circle,#ff5f8f 0%,transparent 68%);animation-duration:9s}
@keyframes float{to{transform:translate(10vw,-7vh) scale(1.25)}}
canvas{position:fixed;inset:0;width:100%;height:100%}
.card{
  position:relative;z-index:2;width:min(88vw,620px);min-height:58vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:35px 20px;border:1px solid rgba(255,255,255,.18);
  border-radius:34px;background:rgba(255,255,255,.07);
  box-shadow:0 0 70px rgba(255,50,190,.18),inset 0 0 45px rgba(255,255,255,.04);
  backdrop-filter:blur(12px);overflow:hidden;
}
.small{font-size:13px;letter-spacing:4px;text-transform:uppercase;opacity:.7;margin-bottom:25px}
#message{
  font-size:clamp(38px,10vw,78px);line-height:1.08;font-weight:800;
  letter-spacing:-2px;
  background:linear-gradient(90deg,#fff,#ff8bdc,#b89cff,#fff,#ff6fba);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:gradient 3s linear infinite,glow 1.7s ease-in-out infinite alternate;
}
@keyframes gradient{to{background-position:300% 0}}
@keyframes glow{to{filter:drop-shadow(0 0 18px rgba(255,80,210,.8))}}
#cursor{display:inline-block;width:3px;height:.9em;background:#fff;margin-left:5px;animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}
.sub{margin-top:28px;font-size:16px;opacity:.72}
.heart{position:fixed;z-index:3;pointer-events:none;animation:rise linear forwards}
@keyframes rise{from{transform:translateY(20vh) scale(.7) rotate(0);opacity:0}15%{opacity:1}to{transform:translateY(-115vh) scale(1.3) rotate(35deg);opacity:0}}
.spark{position:fixed;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 14px #ff7bd8;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.15;transform:scale(.3)}}
button{
 margin-top:32px;padding:12px 20px;border:1px solid rgba(255,255,255,.25);
 border-radius:999px;background:rgba(255,255,255,.08);color:white;font-size:14px;
}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<canvas id="c"></canvas>

<main class="card">
  <div class="small">A little surprise for Dina ✨</div>
  <div id="message"><span id="typed"></span><span id="cursor"></span></div>
  <div class="sub" id="sub">wait for it… 💕</div>
  <button onclick="replay()">Replay ✨</button>
</main>

<script>
const text="I miss you Dina stupid";
const typed=document.getElementById("typed"), sub=document.getElementById("sub");
let timer;
function replay(){
  clearInterval(timer); typed.textContent=""; sub.textContent="wait for it… 💕";
  let i=0;
  timer=setInterval(()=>{
    typed.textContent=text.slice(0,++i);
    if(i>=text.length){
      clearInterval(timer);
      sub.textContent="You better miss me too 😂💕";
      burst();
    }
  },110);
}
function heart(){
  const h=document.createElement("div"); h.className="heart";
  h.textContent=["❤","💗","💖","💕","✨"][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+"vw";
  h.style.bottom="-30px";
  h.style.fontSize=(18+Math.random()*28)+"px";
  h.style.animationDuration=(4+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8500);
}
setInterval(heart,420);
for(let i=0;i<35;i++){
  const s=document.createElement("div");s.className="spark";
  s.style.left=Math.random()*100+"vw";s.style.top=Math.random()*100+"vh";
  s.style.animationDelay=(-Math.random()*2)+"s";document.body.appendChild(s);
}
const c=document.getElementById("c"),x=c.getContext("2d"); let dots=[];
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);dots=[];for(let i=0;i<80;i++)dots.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:(Math.random()-.5)*.4})}
addEventListener("resize",resize);resize();
function anim(){
 x.clearRect(0,0,innerWidth,innerHeight);
 dots.forEach(d=>{d.y+=d.v;if(d.y<0)d.y=innerHeight;if(d.y>innerHeight)d.y=0;
   x.fillStyle="rgba(255,190,240,.45)";x.beginPath();x.arc(d.x,d.y,1.5,0,7);x.fill()});
 requestAnimationFrame(anim)
}
anim();
function burst(){for(let i=0;i<18;i++)setTimeout(heart,i*45)}
replay();
</script>
</body>
</html>
